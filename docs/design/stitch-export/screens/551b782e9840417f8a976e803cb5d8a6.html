        مش حابب أجاوب
      </button>

<!-- Interactive Selection Handler (Micro-interactions) -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.querySelector('form');
      const radioInputs = document.querySelectorAll('input[name="reflection_choice"]');
      
      radioInputs.forEach(input => {
        input.addEventListener('change', () => {
          // Re-render styles dynamically when choices are made
          document.querySelectorAll('label').forEach(lbl => {
            const radio = lbl.querySelector('input');
            const circle = lbl.querySelector('span:last-of-type');
            if (radio && radio.checked) {
              lbl.classList.remove('bg-surface', 'border-controlBorder/40');
              lbl.classList.add('bg-accentSoft', 'border-2', 'border-accent');
              if (circle) {
                circle.classList.add('bg-accent', 'text-surface', 'border-accent');
                circle.classList.remove('border-stone');
                circle.innerHTML = '<span class="material-symbols-outlined text-base" data-icon="check" data-weight="fill" style="font-variation-settings: \'FILL\' 1;">check</span>';
              }
            } else if (radio) {
              lbl.classList.remove('bg-accentSoft', 'border-2', 'border-accent');
              lbl.classList.add('bg-surface', 'border', 'border-controlBorder/40');
              if (circle) {
                circle.classList.remove('bg-accent', 'text-surface', 'border-accent');
                circle.classList.add('border-stone');
                circle.innerHTML = '<span class="w-2.5 h-2.5 rounded-full bg-transparent"></span>';
              }
            }
          });
        });
      });
    });
  </script>
