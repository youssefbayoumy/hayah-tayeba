<!-- Interactive State Handler for Option Selection (Pure micro-interaction) -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
      const labels = document.querySelectorAll('fieldset label');
      labels.forEach(label => {
        label.addEventListener('click', () => {
          labels.forEach(l => {
            // Reset all to unselected styling
            l.className = "group relative flex items-center justify-between min-h-[64px] p-4 bg-surface rounded-2xl border border-border cursor-pointer hover:border-controlBorder active:scale-[0.98] transition-all";
            const iconWrap = l.querySelector('.shrink-0');
            if (iconWrap) {
              iconWrap.className = "w-6 h-6 rounded-full border-2 border-stone group-hover:border-controlBorder flex items-center justify-center shrink-0 transition-colors";
              iconWrap.innerHTML = '<span class="w-2.5 h-2.5 rounded-full bg-transparent group-hover:bg-sand transition-colors"></span>';
            }
            const text = l.querySelector('span.text-ink');
            if (text) text.classList.remove('font-semibold');
          });

          // Apply selected styling to clicked item
          label.className = "relative flex items-center justify-between min-h-[64px] p-4 bg-accentSoft rounded-2xl border-2 border-accent cursor-pointer shadow-sm active:scale-[0.98] transition-all";
          const currentIconWrap = label.querySelector('.shrink-0');
          if (currentIconWrap) {
            currentIconWrap.className = "w-6 h-6 rounded-full bg-accent flex items-center justify-center text-on-primary shrink-0 shadow-sm";
            currentIconWrap.innerHTML = '<span class="material-symbols-outlined text-[18px] font-bold text-on-primary" style="font-variation-settings: \'FILL\' 1;">check</span>';
          }
          const currentText = label.querySelector('span.text-ink');
          if (currentText) currentText.classList.add('font-semibold');
        });
      });
    });
  </script>
