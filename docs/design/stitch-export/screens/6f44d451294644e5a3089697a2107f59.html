<!-- Interactive Logic for Tactile Choice Selection -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
      const cards = document.querySelectorAll('[data-moment-card]');
      
      cards.forEach(card => {
        card.addEventListener('click', () => {
          // Deselect all
          cards.forEach(c => {
            c.classList.remove('bg-accentSoft', 'border-2', 'border-accent', 'shadow-[0px_4px_12px_rgba(36,107,96,0.12)]');
            c.classList.add('bg-surface', 'border', 'border-border', 'shadow-[0px_2px_8px_rgba(36,59,54,0.04)]');
            
            const iconWrap = c.querySelector('.w-10');
            if (iconWrap) {
              iconWrap.className = 'w-10 h-10 rounded-xl flex items-center justify-center bg-canvas border border-border text-ink group-hover:text-accent';
            }

            const check = c.querySelector('.status-indicator');
            if (check) {
              check.classList.add('hidden');
              check.classList.remove('flex');
            }
          });

          // Select current
          card.classList.remove('bg-surface', 'border', 'border-border', 'shadow-[0px_2px_8px_rgba(36,59,54,0.04)]');
          card.classList.add('bg-accentSoft', 'border-2', 'border-accent', 'shadow-[0px_4px_12px_rgba(36,107,96,0.12)]');

          const activeIconWrap = card.querySelector('.w-10');
          if (activeIconWrap) {
            activeIconWrap.className = 'w-10 h-10 rounded-xl flex items-center justify-center bg-surface border border-accent/20 text-accent';
          }

          const activeCheck = card.querySelector('.status-indicator');
          if (activeCheck) {
            activeCheck.classList.remove('hidden');
            activeCheck.classList.add('flex');
          }
        });
      });
    });
  </script>
